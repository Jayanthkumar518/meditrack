{% extends 'base.html' %}

{% block content %}

<h2 class="section-title">
{{ equipment.equipment_name }}
</h2>

<table>

<thead>

<tr>
<th>Date</th>
<th>Technician</th>
<th>Issue</th>
<th>Resolution</th>
<th>Next Due</th>
</tr>

</thead>

<tbody>

{% for log in logs %}

<tr>

<td>{{log.maintenance_date}}</td>

<td>{{log.technician_name}}</td>

<td>{{log.issue_reported}}</td>

<td>{{log.resolution_notes}}</td>

<td>{{log.next_due_date}}</td>

</tr>

{% endfor %}

</tbody>

</table>

{% endblock %}
